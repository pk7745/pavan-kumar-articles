<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F5" />
      <stop offset="100%" stop-color="#F4EFE6" />
    </linearGradient>
    <linearGradient id="line-grad-1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="line-grad-2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="675" fill="url(#bg-grad)" />

  <!-- Grid & Horizon Lines -->
  <g stroke="#E5E0D8" stroke-width="1" opacity="0.6">
    <line x1="100" y1="520" x2="1100" y2="520" />
    <line x1="100" y1="360" x2="1100" y2="360" stroke-dasharray="4 8" />
    <line x1="100" y1="200" x2="1100" y2="200" stroke-dasharray="2 6" />
  </g>

  <!-- Editorial Timeline Milestones -->
  <g fill="#71717A" font-family="Inter, sans-serif" font-size="14" letter-spacing="2">
    <!-- 1947 -->
    <line x1="220" y1="500" x2="220" y2="540" stroke="#71717A" stroke-width="1" />
    <text x="220" y="565" text-anchor="middle" font-weight="600" fill="#475569">1947 · FOUNDATION</text>

    <!-- 2026 -->
    <line x1="600" y1="340" x2="600" y2="540" stroke="#D97706" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="600" cy="340" r="6" fill="#D97706" />
    <text x="600" y="565" text-anchor="middle" font-weight="700" fill="#D97706">2026 · INDIA AT 80</text>

    <!-- 2047 -->
    <line x1="980" y1="180" x2="980" y2="540" stroke="#059669" stroke-width="1" stroke-dasharray="2 4" />
    <circle cx="980" cy="180" r="6" fill="#059669" />
    <text x="980" y="565" text-anchor="middle" font-weight="600" fill="#059669">2047 · CENTENNIAL</text>
  </g>

  <!-- Curved Progress Trajectories -->
  <path d="M 180 510 C 350 490, 480 420, 600 340 C 720 260, 850 200, 1020 170" fill="none" stroke="url(#line-grad-1)" stroke-width="3" stroke-linecap="round" />
  <path d="M 220 520 C 400 480, 520 380, 600 340 C 750 290, 890 220, 1000 180" fill="none" stroke="url(#line-grad-2)" stroke-width="2" stroke-linecap="round" />

  <!-- Subtle Sun / Horizon Symbol -->
  <circle cx="600" cy="340" r="70" fill="none" stroke="#D97706" stroke-width="0.75" opacity="0.3" stroke-dasharray="4 4" />
  <circle cx="600" cy="340" r="120" fill="none" stroke="#059669" stroke-width="0.5" opacity="0.2" />

  <!-- Editorial Watermark Text -->
  <text x="600" y="110" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#27272A" text-anchor="middle" letter-spacing="1">From Independence to a Vision for the Future</text>
</svg>
